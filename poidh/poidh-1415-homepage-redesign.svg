<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Helvetica,Arial,sans-serif">
  <!-- background -->
  <rect width="960" height="600" fill="#0b0e14"/>

  <!-- top bar: sticky bounty ticker (new feature) -->
  <rect x="0" y="0" width="960" height="40" fill="#ff6b3d"/>
  <text x="20" y="26" fill="#0b0e14" font-size="14" font-weight="bold">LIVE: 3 bounties close in &lt;24h — $412 in open rewards</text>
  <text x="820" y="26" fill="#0b0e14" font-size="12">view all →</text>

  <!-- header -->
  <rect x="0" y="40" width="960" height="72" fill="#12161f"/>
  <text x="24" y="86" fill="#f5f5f5" font-size="26" font-weight="bold">poidh</text>
  <text x="140" y="86" fill="#9aa4b2" font-size="14">bounties</text>
  <text x="220" y="86" fill="#9aa4b2" font-size="14">claims</text>
  <text x="290" y="86" fill="#9aa4b2" font-size="14">leaderboard</text>
  <rect x="800" y="58" width="140" height="36" rx="18" fill="#3dd68c"/>
  <text x="825" y="81" fill="#0b0e14" font-size="14" font-weight="bold">Post a bounty</text>

  <!-- hero with color scheme change: warm accent instead of default -->
  <rect x="0" y="112" width="960" height="150" fill="#161b26"/>
  <text x="24" y="165" fill="#ffffff" font-size="30" font-weight="bold">Get paid for the thing you already made.</text>
  <text x="24" y="196" fill="#9aa4b2" font-size="15">Pick a bounty, ship a claim, get funded on-chain. No middleman, no waiting on invoices.</text>
  <rect x="24" y="212" width="150" height="34" rx="6" fill="#ff6b3d"/>
  <text x="45" y="234" fill="#0b0e14" font-size="13" font-weight="bold">Browse bounties</text>

  <!-- new layout: filter rail (left) + bounty grid (right) instead of one long undifferentiated list -->
  <rect x="24" y="284" width="180" height="290" rx="8" fill="#12161f" stroke="#232a38"/>
  <text x="40" y="312" fill="#f5f5f5" font-size="14" font-weight="bold">Filter</text>
  <text x="40" y="340" fill="#9aa4b2" font-size="12">Chain</text>
  <rect x="40" y="350" width="80" height="22" rx="11" fill="#3dd68c"/>
  <text x="55" y="365" fill="#0b0e14" font-size="10" font-weight="bold">Base</text>
  <rect x="128" y="350" width="36" height="22" rx="11" fill="#232a38"/>
  <text x="136" y="365" fill="#9aa4b2" font-size="10">ETH</text>
  <text x="40" y="396" fill="#9aa4b2" font-size="12">Status</text>
  <text x="40" y="418" fill="#f5f5f5" font-size="12">☑ Open</text>
  <text x="40" y="438" fill="#9aa4b2" font-size="12">☐ Multiplayer</text>
  <text x="40" y="458" fill="#9aa4b2" font-size="12">☐ Ending soon</text>
  <text x="40" y="490" fill="#9aa4b2" font-size="12">Reward</text>
  <rect x="40" y="500" width="120" height="6" rx="3" fill="#232a38"/>
  <circle cx="100" cy="503" r="7" fill="#ff6b3d"/>

  <!-- bounty cards grid, 2x2, showing reward + deadline badge prominently -->
  <g>
    <rect x="222" y="284" width="340" height="130" rx="8" fill="#161b26" stroke="#232a38"/>
    <text x="240" y="312" fill="#f5f5f5" font-size="14" font-weight="bold">Homepage redesign</text>
    <rect x="470" y="296" width="72" height="22" rx="11" fill="#ff6b3d"/>
    <text x="482" y="311" fill="#0b0e14" font-size="11" font-weight="bold">$2.69</text>
    <text x="240" y="336" fill="#9aa4b2" font-size="12">multiple claims allowed · best wins</text>
    <rect x="240" y="368" width="130" height="24" rx="12" fill="#232a38"/>
    <text x="252" y="384" fill="#e6bd6b" font-size="11">⏱ closes Sep 30</text>
  </g>
  <g>
    <rect x="580" y="284" width="356" height="130" rx="8" fill="#161b26" stroke="#232a38"/>
    <text x="598" y="312" fill="#f5f5f5" font-size="14" font-weight="bold">Make an ad</text>
    <rect x="850" y="296" width="72" height="22" rx="11" fill="#ff6b3d"/>
    <text x="862" y="311" fill="#0b0e14" font-size="11" font-weight="bold">$13.44</text>
    <text x="598" y="336" fill="#9aa4b2" font-size="12">multiplayer · 4 claims so far</text>
    <rect x="598" y="368" width="150" height="24" rx="12" fill="#3a2323"/>
    <text x="610" y="384" fill="#ff8a7a" font-size="11">⏱ closes in 14h</text>
  </g>
  <g>
    <rect x="222" y="426" width="340" height="130" rx="8" fill="#161b26" stroke="#232a38"/>
    <text x="240" y="454" fill="#f5f5f5" font-size="14" font-weight="bold">Find the secret clue</text>
    <rect x="470" y="438" width="72" height="22" rx="11" fill="#ff6b3d"/>
    <text x="482" y="453" fill="#0b0e14" font-size="11" font-weight="bold">$5.35</text>
    <text x="240" y="478" fill="#9aa4b2" font-size="12">multiplayer · no deadline stated</text>
    <rect x="240" y="510" width="110" height="24" rx="12" fill="#232a38"/>
    <text x="252" y="526" fill="#9aa4b2" font-size="11">open-ended</text>
  </g>
  <g>
    <rect x="580" y="426" width="356" height="130" rx="8" fill="#161b26" stroke="#232a38"/>
    <text x="598" y="454" fill="#f5f5f5" font-size="14" font-weight="bold">Keep Kenjiquest cooking</text>
    <rect x="850" y="438" width="86" height="22" rx="11" fill="#ff6b3d"/>
    <text x="858" y="453" fill="#0b0e14" font-size="11" font-weight="bold">$442.45</text>
    <text x="598" y="478" fill="#9aa4b2" font-size="12">crowdfund-style · ongoing</text>
    <rect x="598" y="510" width="110" height="24" rx="12" fill="#232a38"/>
    <text x="610" y="526" fill="#9aa4b2" font-size="11">open-ended</text>
  </g>

  <text x="24" y="590" fill="#5b6472" font-size="11">Mockup by an autonomous agent claim for poidh bounty #1415. Not affiliated with the poidh team.</text>
</svg>
