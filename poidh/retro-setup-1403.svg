<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="t d">
  <title id="t">Retro desk, 1987</title>
  <desc id="d">A beige desktop computer with a green phosphor CRT, floppy drive, keyboard, mug and desk lamp, drawn as hand-written SVG.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a44"/><stop offset="1" stop-color="#1b1a2e"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a34"/><stop offset="1" stop-color="#5e3a1f"/>
    </linearGradient>
    <linearGradient id="beige" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6dcc0"/><stop offset="1" stop-color="#c9bd9c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#3dff8a" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#0f6b3a"/>
      <stop offset="1" stop-color="#062a18"/>
    </radialGradient>
    <radialGradient id="lampcone" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#000" opacity="0.28"/>
    </pattern>
    <clipPath id="screen"><rect x="188" y="92" width="264" height="190" rx="18"/></clipPath>
  </defs>

  <!-- room -->
  <rect width="640" height="480" fill="url(#wall)"/>
  <g fill="#fff" opacity="0.8">
    <circle cx="60" cy="40" r="1.4"/><circle cx="120" cy="80" r="1"/><circle cx="560" cy="50" r="1.4"/>
    <circle cx="600" cy="110" r="1"/><circle cx="500" cy="30" r="1"/>
  </g>
  <rect x="40" y="30" width="90" height="70" fill="#101020" stroke="#4a4a70" stroke-width="4"/>
  <path d="M40 100 L70 70 L90 90 L108 62 L130 100 Z" fill="#3b2f66"/>
  <circle cx="106" cy="52" r="8" fill="#f4e7a1"/>

  <!-- desk -->
  <rect x="0" y="352" width="640" height="128" fill="url(#desk)"/>
  <rect x="0" y="352" width="640" height="8" fill="#a87346"/>
  <path d="M0 400 H640 M0 440 H640" stroke="#4a2c14" stroke-width="1.5" opacity="0.5"/>

  <!-- lamp -->
  <path d="M40 350 L520 480 H-20 Z" fill="none"/>
  <polygon points="520,90 610,300 430,300" fill="url(#lampcone)" opacity="0"/>
  <g transform="translate(548 352)">
    <ellipse cx="0" cy="0" rx="34" ry="7" fill="#222"/>
    <path d="M0 -2 L-22 -120" stroke="#444" stroke-width="6" stroke-linecap="round"/>
    <path d="M-22 -120 L20 -170" stroke="#444" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-22" cy="-120" r="6" fill="#666"/>
    <path d="M6 -176 L44 -160 L32 -136 L-6 -156 Z" fill="#d94f2b" stroke="#7a2510" stroke-width="2"/>
    <path d="M14 -136 L-70 0 H80 Z" fill="url(#lampcone)"/>
  </g>

  <!-- monitor -->
  <rect x="150" y="60" width="340" height="260" rx="22" fill="url(#beige)" stroke="#8d8368" stroke-width="3"/>
  <rect x="172" y="76" width="296" height="222" rx="16" fill="#3b372c"/>
  <rect x="188" y="92" width="264" height="190" rx="18" fill="url(#glow)"/>
  <g clip-path="url(#screen)" font-family="monospace" font-size="11" fill="#b8ffd0">
    <text x="200" y="112">C:\&gt; DIR /W</text>
    <text x="200" y="128">POIDH   BAS   DRAW   SVG</text>
    <text x="200" y="144">3 FILE(S)  A: 720K FREE</text>
    <text x="200" y="166">C:\&gt; TYPE HELLO.TXT</text>
    <text x="200" y="182">hello from 1987, base chain</text>
    <text x="200" y="198">every pixel is a &lt;path&gt;.</text>
    <text x="200" y="222">C:\&gt; RUN ART.EXE</text>
    <text x="200" y="240">LOADING ......... OK</text>
    <rect x="200" y="252" width="9" height="14" fill="#b8ffd0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="188" y="92" width="264" height="190" fill="url(#scan)"/>
  </g>
  <path d="M200 100 Q260 90 330 98" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.18"/>
  <rect x="188" y="92" width="264" height="190" rx="18" fill="none" stroke="#0a0a0a" stroke-width="3"/>
  <!-- bezel details -->
  <text x="172" y="312" font-family="sans-serif" font-size="9" fill="#6b624a" letter-spacing="2">MICROTRON 386</text>
  <circle cx="470" cy="308" r="4" fill="#4dff88"/>
  <rect x="440" y="304" width="18" height="8" rx="2" fill="#a89e82"/>

  <!-- base unit -->
  <path d="M215 320 H425 L440 340 H200 Z" fill="#b7ac8a"/>
  <rect x="120" y="336" width="400" height="30" rx="6" fill="url(#beige)" stroke="#8d8368" stroke-width="3"/>
  <rect x="150" y="345" width="130" height="8" rx="2" fill="#2a2a2a"/>
  <rect x="152" y="347" width="126" height="1.5" fill="#555"/>
  <rect x="300" y="345" width="130" height="8" rx="2" fill="#2a2a2a"/>
  <rect x="302" y="347" width="126" height="1.5" fill="#555"/>
  <circle cx="452" cy="349" r="3" fill="#ff3b30"/>
  <circle cx="466" cy="349" r="3" fill="#ffb300"/>
  <rect x="482" y="343" width="22" height="12" rx="2" fill="#a89e82"/>

  <!-- keyboard -->
  <g transform="translate(130 388)">
    <path d="M0 40 L20 0 H360 L380 40 Z" fill="#a89e82" stroke="#6b624a" stroke-width="2"/>
    <g fill="#eee6cf" stroke="#8d8368" stroke-width="1">
      <rect x="30" y="6" width="20" height="8" rx="2"/><rect x="54" y="6" width="20" height="8" rx="2"/>
      <rect x="78" y="6" width="20" height="8" rx="2"/><rect x="102" y="6" width="20" height="8" rx="2"/>
      <rect x="126" y="6" width="20" height="8" rx="2"/><rect x="150" y="6" width="20" height="8" rx="2"/>
      <rect x="174" y="6" width="20" height="8" rx="2"/><rect x="198" y="6" width="20" height="8" rx="2"/>
      <rect x="222" y="6" width="20" height="8" rx="2"/><rect x="246" y="6" width="20" height="8" rx="2"/>
      <rect x="270" y="6" width="20" height="8" rx="2"/><rect x="294" y="6" width="20" height="8" rx="2"/>
      <rect x="24" y="18" width="24" height="8" rx="2"/><rect x="52" y="18" width="24" height="8" rx="2"/>
      <rect x="80" y="18" width="24" height="8" rx="2"/><rect x="108" y="18" width="24" height="8" rx="2"/>
      <rect x="136" y="18" width="24" height="8" rx="2"/><rect x="164" y="18" width="24" height="8" rx="2"/>
      <rect x="192" y="18" width="24" height="8" rx="2"/><rect x="220" y="18" width="24" height="8" rx="2"/>
      <rect x="248" y="18" width="24" height="8" rx="2"/><rect x="276" y="18" width="24" height="8" rx="2"/>
      <rect x="304" y="18" width="24" height="8" rx="2"/>
      <rect x="88" y="30" width="200" height="8" rx="3"/>
    </g>
  </g>

  <!-- mouse + pad -->
  <rect x="540" y="384" width="80" height="60" rx="6" fill="#c0392b" opacity="0.9"/>
  <g transform="translate(566 396)">
    <rect width="26" height="38" rx="12" fill="#e6dcc0" stroke="#8d8368" stroke-width="2"/>
    <path d="M13 0 V16 M0 16 H26" stroke="#8d8368" stroke-width="2"/>
    <path d="M13 0 C13 -30 0 -30 -20 -50" stroke="#e6dcc0" stroke-width="2" fill="none" opacity="0"/>
  </g>

  <!-- mug with steam -->
  <g transform="translate(52 300)">
    <rect x="0" y="12" width="46" height="48" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="2"/>
    <path d="M46 24 C66 24 66 48 46 48" fill="none" stroke="#999" stroke-width="5"/>
    <rect x="2" y="14" width="42" height="10" rx="4" fill="#4a2c14"/>
    <text x="9" y="47" font-family="monospace" font-size="10" fill="#c0392b">&lt;/&gt;</text>
    <path d="M14 8 C6 0 22 -6 14 -16 M28 8 C20 0 36 -6 28 -16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- floppy disks -->
  <g transform="translate(24 392) rotate(-8)">
    <rect width="44" height="44" rx="3" fill="#2f4fa8"/>
    <rect x="8" y="0" width="28" height="16" fill="#cfd3de"/>
    <rect x="26" y="3" width="6" height="10" fill="#2f4fa8"/>
    <rect x="6" y="24" width="32" height="18" fill="#f4f0e2"/>
    <path d="M9 30 H35 M9 35 H30" stroke="#999" stroke-width="1"/>
  </g>
  <g transform="translate(78 404) rotate(6)">
    <rect width="44" height="44" rx="3" fill="#b03a2e"/>
    <rect x="8" y="0" width="28" height="16" fill="#cfd3de"/>
    <rect x="26" y="3" width="6" height="10" fill="#b03a2e"/>
    <rect x="6" y="24" width="32" height="18" fill="#f4f0e2"/>
    <path d="M9 30 H35 M9 35 H30" stroke="#999" stroke-width="1"/>
  </g>
</svg>
